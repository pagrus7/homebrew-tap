name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify pinned release archives and formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 -c 'import pathlib, re; print(re.search(r"/releases/download/(v[0-9.]+)/", pathlib.Path("Formula/kaferry.rb").read_text())[1])')
          python3 scripts/update_formula.py "$tag" --check
  install:
    needs: verify
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
      - name: Install and exercise the formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap --custom-remote pagrus7/tap "$GITHUB_WORKSPACE"
          brew audit --strict pagrus7/tap/kaferry
          brew install pagrus7/tap/kaferry
          brew test pagrus7/tap/kaferry
  codeql:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
